# Builds the app on every push to main and uploads it to the hosting over FTP.
# The site runs on plain Apache + PHP: the built frontend and api/ go into the
# site folder; the data lives outside it in ~/liveflow-data (never uploaded).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    FTP hostname
#   FTP_USERNAME  FTP account username
#   FTP_PASSWORD  FTP account password
#   FTP_DIR       optional, site folder as seen by the FTP account, defaults to ./
# Until FTP_SERVER is set, the build still runs and the upload is skipped.
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Check PHP syntax
        run: find api -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Assemble deploy package
        run: |
          mkdir release
          cp -r dist/. release/
          cp -r api release/api
          # The site's .htaccess switches routing to the new build, so it is uploaded last.
          mv release/.htaccess site.htaccess

      - name: Skip upload (FTP_SERVER not configured)
        if: env.FTP_SERVER == ''
        run: echo "::notice::FTP_SERVER secret is not set, so the build was not uploaded."

      - name: Upload over FTP
        if: env.FTP_SERVER != ''
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR || '.' }}
        run: |
          sudo apt-get install -y -qq lftp
          # Shared-hosting FTP certificates are issued for the server name, not
          # the account's domain, so TLS is used without verifying the hostname.
          # Old build assets are removed so stale hashed files do not pile up;
          # leftovers of the earlier Node.js deployment are removed once.
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" <<EOF
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set net:timeout 20
          set net:max-retries 3
          set net:reconnect-interval-base 5
          mirror --reverse --verbose --parallel=1 release/ "$FTP_DIR"
          mirror --reverse --verbose --delete release/assets/ "$FTP_DIR/assets"
          rm -r -f "$FTP_DIR/dist" "$FTP_DIR/server-dist" "$FTP_DIR/tmp"
          rm -f "$FTP_DIR/start.sh" "$FTP_DIR/package.json"
          put site.htaccess -o "$FTP_DIR/.htaccess"
          bye
          EOF
