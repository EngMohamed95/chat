# Builds the app on every push to main and uploads a ready-to-run copy to the
# hosting server over FTP. The hosting panel runs the Node app from that folder.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    FTP hostname
#   FTP_USERNAME  FTP account username
#   FTP_PASSWORD  FTP account password
#   FTP_DIR       optional, app folder as seen by the FTP account, defaults to ./
# Until FTP_SERVER is set, the build still runs and the upload is skipped.
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Assemble deploy package
        run: |
          mkdir release
          cp -r dist server-dist release/
          # express is bundled into server-dist, so there is nothing to npm install.
          cat > release/package.json <<'JSON'
          {
            "name": "liveflow",
            "private": true,
            "type": "module",
            "main": "server-dist/index.mjs",
            "engines": { "node": ">=20.11" },
            "scripts": { "start": "node server-dist/index.mjs" }
          }
          JSON
          # The server exits when tmp/restart.txt changes, and the host restarts it.
          mkdir -p release/tmp
          date -u > release/tmp/restart.txt

      - name: Skip upload (FTP_SERVER not configured)
        if: env.FTP_SERVER == ''
        run: echo "::notice::FTP_SERVER secret is not set, so the build was not uploaded."

      - name: Upload over FTP
        if: env.FTP_SERVER != ''
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR || '.' }}
        run: |
          sudo apt-get install -y -qq lftp
          # Shared-hosting FTP certificates are issued for the server name, not
          # the account's domain, so TLS is used without verifying the hostname.
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" <<EOF
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set net:timeout 20
          set net:max-retries 3
          set net:reconnect-interval-base 5
          mirror --reverse --verbose --parallel=1 --exclude tmp/ release/ "$FTP_DIR"
          mkdir -p -f "$FTP_DIR/tmp"
          put release/tmp/restart.txt -o "$FTP_DIR/tmp/restart.txt"
          bye
          EOF
