# Builds the app on every push to main and uploads it to the hosting server
# over SSH, then restarts the Node process there.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST     server hostname or IP
#   SSH_USER     SSH username
#   SSH_KEY      private key whose public half is in ~/.ssh/authorized_keys on the server
#   SSH_PORT     optional, defaults to 22
#   APP_DIR      optional, app folder relative to the SSH home, defaults to liveflow
#   APP_PORT     optional, port the Node server listens on, defaults to 3001
# Until SSH_HOST is set, the build still runs and the upload is skipped.
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      APP_DIR: ${{ secrets.APP_DIR || 'liveflow' }}
      APP_PORT: ${{ secrets.APP_PORT || '3001' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Assemble deploy package
        run: |
          mkdir release
          cp -r dist server-dist release/
          # The bundled server only needs express at runtime.
          node -e '
            const pkg = require("./package.json");
            const out = {
              name: "liveflow",
              private: true,
              type: "module",
              engines: { node: ">=20.11" },
              scripts: { start: "node server-dist/index.mjs" },
              dependencies: { express: pkg.dependencies.express },
            };
            console.log(JSON.stringify(out, null, 2));
          ' > release/package.json

      - name: Skip upload (SSH_HOST not configured)
        if: env.SSH_HOST == ''
        run: echo "::notice::SSH_HOST secret is not set, so the build was not uploaded."

      - name: Set up SSH
        if: env.SSH_HOST != ''
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload and restart
        if: env.SSH_HOST != ''
        run: |
          SSH="ssh -i $HOME/.ssh/id_deploy -p $SSH_PORT $SSH_USER@$SSH_HOST"

          # Replace the built files; the data folder lives outside APP_DIR so it survives deploys.
          tar -czf - -C release . | $SSH "mkdir -p '$APP_DIR' && cd '$APP_DIR' && rm -rf dist server-dist && tar -xzf -"

          $SSH APP_DIR="'$APP_DIR'" APP_PORT="'$APP_PORT'" bash -s <<'REMOTE'
          set -e
          [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"
          cd "$APP_DIR"
          node -v
          npm install --omit=dev --no-audit --no-fund

          if [ -f app.pid ] && kill -0 "$(cat app.pid)" 2>/dev/null; then
            kill "$(cat app.pid)"
            sleep 2
          fi

          mkdir -p "$HOME/liveflow-data"
          NODE_ENV=production PORT="$APP_PORT" DATA_DIR="$HOME/liveflow-data" TRUST_PROXY=1 \
            setsid nohup node server-dist/index.mjs > app.log 2>&1 < /dev/null &
          echo $! > app.pid

          sleep 3
          if ! kill -0 "$(cat app.pid)" 2>/dev/null; then
            echo "Server failed to start:"
            tail -n 50 app.log
            exit 1
          fi
          tail -n 10 app.log
          REMOTE
