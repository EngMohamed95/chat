# Builds the app on every push to main and uploads a ready-to-run copy to the
# hosting server over FTP. The hosting panel runs the Node app from that folder.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    FTP hostname
#   FTP_USERNAME  FTP account username
#   FTP_PASSWORD  FTP account password
#   FTP_DIR       optional, app folder as seen by the FTP account, defaults to ./
# Until FTP_SERVER is set, the build still runs and the upload is skipped.
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Assemble deploy package
        run: |
          mkdir release
          cp -r dist server-dist release/
          # express is bundled into server-dist, so there is nothing to npm install.
          cat > release/package.json <<'JSON'
          {
            "name": "liveflow",
            "private": true,
            "type": "module",
            "main": "server-dist/index.mjs",
            "engines": { "node": ">=20.11" },
            "scripts": { "start": "node server-dist/index.mjs" }
          }
          JSON
          # Touching tmp/restart.txt tells the panel's Node app manager to restart the app.
          mkdir -p release/tmp
          date -u > release/tmp/restart.txt

      - name: Skip upload (FTP_SERVER not configured)
        if: env.FTP_SERVER == ''
        run: echo "::notice::FTP_SERVER secret is not set, so the build was not uploaded."

      - name: Upload over FTP
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # The server resets plain-FTP data connections; it expects explicit TLS.
          protocol: ftps
          local-dir: ./release/
          server-dir: ${{ secrets.FTP_DIR || './' }}
