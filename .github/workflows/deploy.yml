# Builds the app on every push to main and publishes a ready-to-run copy to the
# `deploy` branch. Hostinger's Node.js web app is connected to that branch, so it
# only ever receives builds that passed the checks below.
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Assemble deploy package
        run: |
          mkdir release
          cp -r dist server-dist release/
          # The bundled server only needs express at runtime.
          node -e '
            const pkg = require("./package.json");
            const out = {
              name: "liveflow",
              private: true,
              type: "module",
              engines: { node: ">=20.11" },
              scripts: { start: "node server-dist/index.mjs" },
              dependencies: { express: pkg.dependencies.express },
            };
            console.log(JSON.stringify(out, null, 2));
          ' > release/package.json

      - name: Push to deploy branch
        working-directory: release
        run: |
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy
